<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gverb WASM Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 24px auto; padding: 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    label { display: inline-flex; gap: 8px; align-items: center; }
    input[type='range'] { width: 180px; }
    .panel { border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    button { padding: 6px 10px; }
  </style>
</head>
<body>
  <h1>gverb WebAssembly Demo</h1>

  <div class="panel">
    <div class="row">
      <input id="file" type="file" accept="audio/*" />
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
      <button id="export">Exportar WAV processado</button>
    </div>

    <div class="row">
      <label>Tempo <input id="seek" type="range" min="0" max="1" step="0.001" value="0" /></label>
      <span id="time">00:00 / 00:00</span>
      <label><input id="loop" type="checkbox" /> Loop</label>
    </div>

    <div class="row">
      <label>Volume <input id="volume" type="range" min="0" max="2" step="0.01" value="1" /></label>
      <label>Velocidade <input id="rate" type="range" min="0.5" max="2" step="0.01" value="1" /></label>
    </div>
  </div>

  <div class="panel">
    <h3>Parâmetros do GVerb</h3>
    <div class="row"><label>Room Size <input data-param="roomsize" type="range" min="1" max="300" step="0.1" value="30" /></label></div>
    <div class="row"><label>Rev Time <input data-param="revtime" type="range" min="0.1" max="20" step="0.01" value="3" /></label></div>
    <div class="row"><label>Damping <input data-param="damping" type="range" min="0" max="1" step="0.001" value="0.5" /></label></div>
    <div class="row"><label>Input BW <input data-param="inputbandwidth" type="range" min="0" max="1" step="0.001" value="0.9" /></label></div>
    <div class="row"><label>Early Level <input data-param="earlylevel" type="range" min="0" max="1" step="0.001" value="0.3" /></label></div>
    <div class="row"><label>Tail Level <input data-param="taillevel" type="range" min="0" max="1" step="0.001" value="0.5" /></label></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
