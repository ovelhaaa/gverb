<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dimension5 Lab</title>
  <style>
    :root { color-scheme: dark; --bg:#101317; --panel:#1a2027; --panel2:#232b34; --line:#3a4553; --txt:#ebf1f7; --accent:#ffb020; --ok:#18c79c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Inter", system-ui, sans-serif; background: radial-gradient(circle at 30% -20%, #27313d 0%, var(--bg) 45%); color: var(--txt); }
    .shell { max-width: 1060px; margin: 20px auto; padding: 16px; }
    .rack { border:1px solid #4a5664; background: linear-gradient(180deg,var(--panel2),var(--panel)); border-radius:14px; box-shadow: inset 0 2px 0 rgba(255,255,255,.06), 0 8px 30px rgba(0,0,0,.45); padding:18px; }
    h1 { margin:0 0 12px; font-size: 1.35rem; letter-spacing: .04em; text-transform: uppercase; }
    .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; }
    .panel { background:#10161d; border:1px solid var(--line); border-radius:12px; padding:14px; }
    .drop { border:2px dashed #5f6f82; border-radius:10px; padding:16px; text-align:center; transition:.2s; }
    .drop.dragging { border-color: var(--accent); background: rgba(255,176,32,.08); }
    .row { display:flex; gap:10px; align-items:center; flex-wrap: wrap; margin-top: 10px; }
    button, .btn { border:1px solid #5d6a78; border-radius:10px; background:#1e2731; color:var(--txt); padding:10px 12px; cursor:pointer; }
    button:hover, .btn:hover { filter: brightness(1.08); }
    .accent { border-color:#8d6320; background:#5e4315; }
    .danger { border-color:#8a2f3b; background:#4a1d23; }
    input[type=range] { width:100%; }
    .control { margin: 10px 0; }
    .cap { display:flex; justify-content:space-between; font-size:.85rem; opacity:.92; }
    .status { padding:8px 10px; border-radius:999px; border:1px solid #536170; background:#0e141b; font-size:.82rem; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="rack">
      <h1>Dimension5 • Reverb Hardware Deck</h1>
      <div class="grid">
        <section class="panel">
          <div id="dropZone" class="drop">
            <p>Arraste WAV/MP3 aqui ou selecione manualmente.</p>
            <label for="fileInput">Arquivo de áudio local</label>
            <input id="fileInput" type="file" accept="audio/wav,audio/mpeg,audio/*" />
            <div class="row">
              <span id="fileName" class="status">Nenhum arquivo</span>
              <span id="status" class="status">Pronto</span>
            </div>
          </div>

          <div class="row">
            <button id="play" class="accent">▶ Play</button>
            <button id="stop" class="danger">■ Stop</button>
            <button id="export">Exportar WAV</button>
            <label><input id="loop" type="checkbox" checked /> Loop</label>
            <label><input id="bypass" type="checkbox" /> Bypass</label>
          </div>

          <div class="control">
            <div class="cap"><span id="seekLabel">Timeline</span><span id="time">00:00 / 00:00</span></div>
            <input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-labelledby="seekLabel" />
          </div>

          <div class="control">
            <div class="cap"><span id="outputLabel">Saída</span></div>
            <input id="output" type="range" min="0" max="2" step="0.01" value="1" aria-labelledby="outputLabel" />
          </div>
        </section>

        <section class="panel">
          <div class="control"><div class="cap"><span id="roomsizeLabel">Roomsize</span><span data-value="roomsize"></span></div><input id="roomsize" data-param="roomsize" type="range" min="1" max="300" step="0.1" value="30" aria-labelledby="roomsizeLabel" /></div>
          <div class="control"><div class="cap"><span id="revtimeLabel">Revtime</span><span data-value="revtime"></span></div><input id="revtime" data-param="revtime" type="range" min="0.1" max="20" step="0.01" value="3" aria-labelledby="revtimeLabel" /></div>
          <div class="control"><div class="cap"><span id="dampingLabel">Damping</span><span data-value="damping"></span></div><input id="damping" data-param="damping" type="range" min="0" max="1" step="0.001" value="0.5" aria-labelledby="dampingLabel" /></div>
          <div class="control"><div class="cap"><span id="inputbandwidthLabel">Input BW</span><span data-value="inputbandwidth"></span></div><input id="inputbandwidth" data-param="inputbandwidth" type="range" min="0" max="1" step="0.001" value="0.9" aria-labelledby="inputbandwidthLabel" /></div>
          <div class="control"><div class="cap"><span id="earlylevelLabel">Early Level</span><span data-value="earlylevel"></span></div><input id="earlylevel" data-param="earlylevel" type="range" min="0" max="1" step="0.001" value="0.3" aria-labelledby="earlylevelLabel" /></div>
          <div class="control"><div class="cap"><span id="taillevelLabel">Tail Level</span><span data-value="taillevel"></span></div><input id="taillevel" data-param="taillevel" type="range" min="0" max="1" step="0.001" value="0.5" aria-labelledby="taillevelLabel" /></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
