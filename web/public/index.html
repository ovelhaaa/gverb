<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gverb Web Studio</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Inter, system-ui, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 12px; background: #111827; color: #e5e7eb; }
    h1, h3 { margin: 0 0 12px; }
    .panel { background: #1f2937; border: 1px solid #374151; padding: 14px; border-radius: 10px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    label { display: inline-flex; gap: 8px; align-items: center; }
    input[type='range'] { width: 200px; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #374151; background: #0f172a; color: #e5e7eb; cursor: pointer; }
    button:hover { background: #111827; }
    button.primary { background: #1d4ed8; border-color: #2563eb; }
    .pill { padding: 2px 10px; border-radius: 999px; background: #0f172a; border: 1px solid #374151; font-size: 12px; }
    .meter { min-width: 100px; font-variant-numeric: tabular-nums; }
    .grow { flex: 1; min-width: 220px; }
  </style>
</head>
<body>
  <h1>gverb Web Studio</h1>

  <div class="panel">
    <div class="row">
      <input id="file" type="file" accept="audio/*" />
      <span id="filename" class="pill">Nenhum arquivo carregado</span>
      <span id="status" class="pill">Pronto</span>
    </div>

    <div class="row">
      <button id="rewind">⏪ -10s</button>
      <button id="playpause" class="primary">▶️ Play</button>
      <button id="stop">⏹ Stop</button>
      <button id="forward">+10s ⏩</button>
      <button id="export">Exportar WAV processado</button>
      <label><input id="repeat" type="checkbox" /> Repeat</label>
    </div>

    <div class="row">
      <label class="grow">Tempo
        <input id="seek" type="range" min="0" max="1" step="0.001" value="0" />
      </label>
      <span id="time" class="meter">00:00 / 00:00</span>
    </div>

    <div class="row">
      <label>Volume <input id="volume" type="range" min="0" max="2" step="0.01" value="1" /></label>
      <output id="volumeValue" class="meter">100%</output>
      <label>Velocidade <input id="rate" type="range" min="0.5" max="2" step="0.01" value="1" /></label>
      <output id="rateValue" class="meter">1.00x</output>
    </div>
  </div>

  <div class="panel">
    <h3>Parâmetros do GVerb (tempo real)</h3>
    <div class="row"><label>Room Size <input data-param="roomsize" type="range" min="1" max="300" step="0.1" value="30" /></label><output data-param-value="roomsize">30.0</output></div>
    <div class="row"><label>Rev Time <input data-param="revtime" type="range" min="0.1" max="20" step="0.01" value="3" /></label><output data-param-value="revtime">3.00</output></div>
    <div class="row"><label>Damping <input data-param="damping" type="range" min="0" max="1" step="0.001" value="0.5" /></label><output data-param-value="damping">0.500</output></div>
    <div class="row"><label>Input BW <input data-param="inputbandwidth" type="range" min="0" max="1" step="0.001" value="0.9" /></label><output data-param-value="inputbandwidth">0.900</output></div>
    <div class="row"><label>Early Level <input data-param="earlylevel" type="range" min="0" max="1" step="0.001" value="0.3" /></label><output data-param-value="earlylevel">0.300</output></div>
    <div class="row"><label>Tail Level <input data-param="taillevel" type="range" min="0" max="1" step="0.001" value="0.5" /></label><output data-param-value="taillevel">0.500</output></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
